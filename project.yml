name: CineShelf

options:
  bundleIdPrefix: fr.feltrin
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: fr
  groupSortPosition: top
  xcodeVersion: "2600"

# Packages locaux. Aucune dépendance externe : c'est une règle du projet.
packages:
  CineShelfCore:
    path: Packages/CineShelfCore
  DesignSystem:
    path: Packages/DesignSystem
  MediaKit:
    path: Packages/MediaKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    CODE_SIGN_STYLE: Automatic
    # Vide tant que l'abonnement Apple Developer n'est pas souscrit.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO
    # XcodeGen n'ecrit pas PRODUCT_NAME et Xcode 26 ne lui donne plus de valeur
    # par defaut : le nom de module devient vide et la cible ne compile pas
    # (« module name "" is not a valid identifier »). Les cibles app le
    # definissent deja ; cette ligne couvre les cibles de test.
    PRODUCT_NAME: "$(TARGET_NAME)"
  configs:
    # Debug uniquement : en Release on veut les deux architectures (arm64 et
    # x86_64) pour produire un binaire universel distribuable.
    Debug:
      ONLY_ACTIVE_ARCH: YES

# ---------------------------------------------------------------------------
# SUPPORTED_PLATFORMS / TARGETED_DEVICE_FAMILY explicites :
# contournement d'un bug de XcodeGen.
#
# Versions concernees : XcodeGen 2.46.0 (derniere stable au 03/08/2026), et
# 2.45.4. Pour toute cible declaree avec `supportedDestinations`, les deux
# reglages sont ecrits a la chaine vide dans le .pbxproj :
#   SUPPORTED_PLATFORMS = "";
#   TARGETED_DEVICE_FAMILY = "";
#
# Deux symptomes distincts, tous deux bloquants :
#
# 1. SUPPORTED_PLATFORMS vide -> sans plateforme resolue, Xcode 26 compile la
#    cible app avec un triplet indetermine et rejette les modules SwiftPM
#    pourtant bien compiles :
#      warning: Module file '.../CineShelfCore.swiftmodule/arm64-apple-macos.swiftmodule'
#               is incompatible with this Swift compiler: built for incompatible target
#      error: Unable to resolve module dependency: 'CineShelfCore'
#    Le build echoue des le premier `import CineShelfCore`.
#
# 2. TARGETED_DEVICE_FAMILY vide -> aucun simulateur iOS ne correspond plus a
#    la cible, meme designe par UDID :
#      error: Unable to find a destination matching the provided destination specifier
#      (... doesn't match any of CineShelf.app's targeted device families)
#    Le build macOS passe, le build iOS non.
#
# Reproduction (spec minimal, hors de ce depot) :
#   mkdir -p /tmp/xg/Src && cd /tmp/xg && echo 'import Foundation' > Src/A.swift
#   printf 'name: T\ntargets:\n  T:\n    type: application\n    supportedDestinations: [iOS, macOS]\n    sources: [Src]\n' > project.yml
#   xcodegen generate
#   grep -E 'SUPPORTED_PLATFORMS|TARGETED_DEVICE_FAMILY' T.xcodeproj/project.pbxproj
#   # attendu si le bug est corrige : plus aucune valeur = "";
#
# A supprimer le jour ou XcodeGen emet les bonnes valeurs : relancer la
# reproduction ci-dessus, et si elle est verte, retirer ces deux reglages de
# chaque cible puis verifier le build iOS *et* macOS.
# ---------------------------------------------------------------------------
targets:
  CineShelf:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: CineShelfCore
        product: CineShelfCore
      - package: DesignSystem
        product: DesignSystem
      - package: MediaKit
        product: MediaKit
    settings:
      base:
        # cf. bloc SUPPORTED_PLATFORMS ci-dessus (bug XcodeGen 2.46.0)
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: fr.feltrin.CineShelf
        PRODUCT_NAME: CineShelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/CineShelf.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Signature ad hoc : permet de lancer l'app sur ce Mac sans compte payant.
        # À supprimer une fois DEVELOPMENT_TEAM renseigné.
        Debug:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        Release:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"

  # Tests de logique, sans app hôte : ils ne lancent pas l'interface, donc ils
  # tournent en CI comme en local sans autorisation système. C'est ici
  # qu'atterriront les CloudKitConformanceTests.
  CineShelfTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/CineShelfTests
      # La logique de navigation, compilée dans la cible de test plutôt
      # qu'importée : la lier à la cible app imposerait un TEST_HOST, donc de
      # lancer l'interface — exactement ce que cette cible évite (voir plus
      # haut). Ces trois fichiers ne dépendent d'aucune vue de feature, c'est
      # pour ça qu'`AppSection.destination` vit dans un fichier séparé.
      - App/Navigation/AppRoute.swift
      - App/Navigation/AppSection.swift
      - App/Navigation/NavigationModel.swift
      - App/Navigation/TitleFilter.swift
    dependencies:
      - package: CineShelfCore
        product: CineShelfCore
      - package: MediaKit
        product: MediaKit
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        # cf. bloc SUPPORTED_PLATFORMS ci-dessus (bug XcodeGen 2.46.0)
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: fr.feltrin.CineShelf.Tests
        GENERATE_INFOPLIST_FILE: YES

  # Catalogue du design system : une app à part, qui ne connaît que le package
  # DesignSystem. C'est aussi la preuve d'indépendance : si le catalogue compile
  # sans CineShelfCore ni MediaKit, le package ne dépend de rien d'autre.
  DesignSystemCatalog:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Catalog
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        # cf. bloc SUPPORTED_PLATFORMS ci-dessus (bug XcodeGen 2.46.0)
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: fr.feltrin.CineShelf.DesignSystemCatalog
        PRODUCT_NAME: DesignSystemCatalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Catalogue
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        Release:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"

  # Tests du package DesignSystem rejoués sous xcodebuild.
  #
  # Pourquoi cette cible existe alors que `swift test` couvre déjà le package :
  # SwiftPM ne lance pas `actool`, il se contente de recopier Colors.xcassets.
  # Sous `swift test`, aucun Color Set ne se résout et les tests d'assets se
  # mettent en « skipped ». Seul un build Xcode compile le catalogue — d'où
  # cette cible, qui rejoue les mêmes sources avec les assets réellement
  # compilés. XCODE_ASSET_TESTS y active en plus un test qui échoue si le
  # catalogue venait à ne plus être compilé (sans lui, une régression se
  # traduirait par des tests « skipped », donc verts).
  DesignSystemAssetTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Packages/DesignSystem/Tests/DesignSystemTests
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        # cf. bloc SUPPORTED_PLATFORMS ci-dessus (bug XcodeGen 2.46.0)
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: fr.feltrin.CineShelf.DesignSystemAssetTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) XCODE_ASSET_TESTS"

  # iOS uniquement : sur macOS, les tests UI réclament l'autorisation
  # d'accessibilité, qui ne se donne qu'à la main dans Réglages Système.
  # Ajoute macOS ici le jour où tu veux les lancer sur le Mac.
  CineShelfUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - Tests/CineShelfUITests
    dependencies:
      - target: CineShelf
    settings:
      base:
        # cf. bloc SUPPORTED_PLATFORMS ci-dessus (bug XcodeGen 2.46.0).
        # iOS seul ici : cette cible ne tourne pas sur macOS.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: fr.feltrin.CineShelf.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CineShelf

schemes:
  # Schéma de travail : marche sur iOS comme sur macOS.
  CineShelf:
    build:
      targets:
        CineShelf: all
        CineShelfTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: CineShelfTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Catalogue du design system, iOS et macOS.
  #   xcodebuild -scheme DesignSystemCatalog -destination 'platform=macOS' build
  # Le schéma embarque les tests d'assets et de rendu, qui ont besoin d'un build
  # Xcode pour disposer d'un Colors.xcassets compilé.
  DesignSystemCatalog:
    build:
      targets:
        DesignSystemCatalog: all
        DesignSystemAssetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DesignSystemAssetTests

  # Tests d'interface : simulateur iOS uniquement.
  #   xcodebuild test -scheme CineShelfUITests \
  #     -destination 'platform=iOS Simulator,name=iPhone 17'
  CineShelfUITests:
    build:
      targets:
        CineShelf: all
        CineShelfUITests: [test]
    test:
      config: Debug
      targets:
        - name: CineShelfUITests
