name: CI

# Les runners macOS de GitHub consomment les minutes gratuites au tarif ×10.
# On ne déclenche donc que sur les pull requests et sur main, jamais sur les
# push de branche de travail.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: CineShelf
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint --strict

      # swift-format est livré avec la chaîne d'outils Xcode, mais **n'est pas dans
      # le PATH** : il faut passer par `xcrun`, sur le runner comme en local. Sans
      # ça, l'étape échoue en `command not found` (exit 127) — ce qui s'est produit
      # du 2 au 3 août, et ne se voyait pas puisque la commande locale, elle,
      # utilisait déjà `xcrun`.
      - name: swift-format
        run: xcrun swift-format lint --recursive --strict App Catalog Packages Tests

  packages:
    name: Tests des packages
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [CineShelfCore, DesignSystem, MediaKit]
    steps:
      - uses: actions/checkout@v4

      - name: Tests ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            # Aucun appareil nomme : compiler pour le simulateur demande un SDK, pas un
            # iPhone. C'est le specificateur correct pour un build, et il retire d'un
            # coup la dependance a un runner qui aurait des appareils crees.
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  # Le catalogue du design system : app a part, et surtout seul endroit ou les
  # tests d'assets et de rendu tournent avec un Colors.xcassets compile
  # (SwiftPM ne lance pas actool, cf. project.yml).
  catalog:
    name: Catalogue ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: platform=iOS Simulator,name=iPhone 17,OS=latest
          - platform: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet
        run: xcodegen generate

      - name: Resoudre la destination
        run: |
          echo "DESTINATION=$(scripts/ci-destination.sh '${{ matrix.destination }}')" \
            >> "$GITHUB_ENV"

      - name: Tests du catalogue
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DesignSystemCatalog \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Tests ${{ matrix.name }}
    runs-on: macos-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tests de logique : tournent sur Mac, sans simulateur ni interface.
          - name: logique (macOS)
            scheme: CineShelf
            destination: platform=macOS
          # Sondes de rendu d'ecran : la seule suite qui charge l'app (TEST_HOST), et la
          # seule qui assene qu'un ecran dessine autre chose qu'un aplat. macOS uniquement,
          # cf. le commentaire de la cible dans project.yml.
          - name: rendu d'ecran (macOS)
            scheme: CineShelfScreenTests
            destination: platform=macOS
          # Tests d'interface : simulateur iOS uniquement, cf. README.
          - name: interface (iOS)
            scheme: CineShelfUITests
            destination: platform=iOS Simulator,name=iPhone 17,OS=latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet
        run: xcodegen generate

      - name: Resoudre la destination
        run: |
          echo "DESTINATION=$(scripts/ci-destination.sh '${{ matrix.destination }}')" \
            >> "$GITHUB_ENV"

      # **Prechauffage du simulateur, et c'est une mesure qui le motive.** Le lancement
      # d'app sous XCUITest varie d'un facteur 3,3 sur le MEME code — 18,6 s et 28,5 s a
      # chaud, 61 s a froid, mesure du 2026-08-06 sur iPhone 17. Chaque runner CI est froid,
      # donc le lancement frole le delai de xcodebuild et le franchit par intermittence :
      # « Timed out while launching application via Xcode » a 86 s, deux fois de suite, sur
      # un test qui passe en local. Ce n'est pas une regression du code — c'est de la
      # variance trop proche de la borne. Amorcer le simulateur avant la mesure la ramene
      # dans le regime chaud.
      - name: Prechauffer le simulateur
        if: contains(matrix.destination, 'iOS Simulator')
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['udid'] for v in d.values() for x in v if x['name']=='iPhone 17'))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "${{ matrix.scheme }}" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO
