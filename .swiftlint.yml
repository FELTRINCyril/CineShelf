included:
  - App
  - Catalog
  - Packages
  - Tests

excluded:
  - .build
  - DerivedData
  - Packages/*/.build
  - "**/.build"

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

line_length:
  warning: 120
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

identifier_name:
  min_length: 2
  excluded: [id, ok, x, y, z]

nesting:
  type_level: 2

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

custom_rules:
  no_literal_color:
    name: "Couleur littérale"
    message: "Les couleurs se déclarent dans Packages/DesignSystem, jamais ailleurs."
    regex: '(Color\(\s*(red|hex)\s*:|UIColor\(|NSColor\(|#[0-9A-Fa-f]{6}\b)'
    excluded: ".*/Packages/DesignSystem/.*"
    severity: error

  no_fixed_font_size:
    name: "Taille de police fixe"
    message: "Utilise .font(.system(size:relativeTo:)) ou un Font.<textStyle> : le texte doit suivre Dynamic Type."
    regex: '\.system\(\s*size:\s*[0-9]+(\.[0-9]+)?\s*[,)](?![^)]*relativeTo)'
    severity: error

  no_corner_radius:
    name: "cornerRadius déprécié"
    message: "Utilise .clipShape(.rect(cornerRadius:style: .continuous))."
    regex: '\.cornerRadius\('
    severity: error

  # Depuis L1, `refreshDerived()` compose `filterKeys` à partir des relations :
  # bibliothèque, collection, genres et personnes créditées y sont dénormalisés pour
  # être interrogeables en SQL. Une relation écrite sans rafraîchissement laisse donc
  # `filterKeys` en arrière, et l'entité devient introuvable par le filtre
  # correspondant — sans erreur, sans avertissement, et sans qu'aucun test de critère
  # ne bronche, puisque la relation est bien posée.
  #
  # Les seules portes autorisées sont les mutateurs de `TitleRepository` et de
  # `PersonRepository` (section « Relations »), qui appellent `refreshDerived()`.
  #
  # Exclusions, toutes assumées :
  #   - `Packages/CineShelfCore` : c'est là que vivent les mutateurs eux-mêmes ;
  #   - `Tests/` et `Packages/*/Tests` : les fixtures posent les relations à la main
  #     **exprès**, et rappellent `refreshDerived()` explicitement — c'est ce qui
  #     permet à `FilterKeyTests` de vérifier l'invariant, y compris à l'envers ;
  #   - `App/DemoData` : décision actée, une fixture n'est pas une action
  #     utilisateur et ne doit pas produire trois cents entrées de fil d'activité.
  #     `DemoCatalogTests` vérifie que ses `filterKeys` sont à jour.
  no_relation_write_outside_core:
    name: "Écriture de relation hors CineShelfCore"
    message: >-
      Une relation dénormalisée dans filterKeys ne s'écrit pas directement : passe par
      TitleRepository/PersonRepository (section Relations), qui appellent
      refreshDerived(). Sinon le filtre correspondant devient faux en silence.
    regex: '(?<!self)\.(genres|credits|collection|library)\s*=(?!=)'
    excluded:
      - ".*/Packages/CineShelfCore/.*"
      - ".*/Tests/.*"
      - ".*/App/DemoData/.*"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  # `#Predicate` plafonne à **cinq clauses** sur un `@Model` SwiftData — mesuré, voir
  # `predicateClause(active:_:)` et `docs/02` §5. Ce plafond ne se devine pas : au-delà,
  # la compilation part en trente secondes puis échoue, et à cinq elle coûte déjà 1,3 s
  # sans rien dire.
  #
  # Tous les prédicats vivent donc dans `Packages/CineShelfCore`, à côté de cette
  # documentation et des outils qui permettent de dépasser le plafond. La règle est
  # posée au niveau du **module** et non du seul fichier qui porte `predicateClause` :
  # les repositories ont de bonnes raisons d'interroger le magasin, et les y interdire
  # aurait forcé un détour sans bénéfice. Ce qu'on veut empêcher, c'est un prédicat
  # écrit dans une vue — où personne ne lira l'avertissement, et où aucune cible de
  # test ne peut le couvrir.
  no_predicate_outside_core:
    name: "#Predicate hors CineShelfCore"
    message: >-
      Les prédicats vivent dans CineShelfCore/Queries : #Predicate plafonne à cinq
      clauses sur un @Model, et une vue n'est couverte par aucun test. Ajoute une
      fabrique à EntityQueries, ou une clause à un filtre existant via predicateClause.
    regex: '#Predicate'
    excluded:
      - ".*/Packages/CineShelfCore/.*"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error
