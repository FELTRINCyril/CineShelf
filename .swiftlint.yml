included:
  - App
  - Packages
  - Tests

excluded:
  - .build
  - DerivedData
  - Packages/*/.build
  - "**/.build"

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

line_length:
  warning: 120
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

identifier_name:
  min_length: 2
  excluded: [id, ok, x, y, z]

nesting:
  type_level: 2

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

custom_rules:
  no_literal_color:
    name: "Couleur littérale"
    message: "Les couleurs se déclarent dans Packages/DesignSystem, jamais ailleurs."
    regex: '(Color\(\s*(red|hex)\s*:|UIColor\(|NSColor\(|#[0-9A-Fa-f]{6}\b)'
    excluded: ".*/Packages/DesignSystem/.*"
    severity: error

  no_fixed_font_size:
    name: "Taille de police fixe"
    message: "Utilise .font(.system(size:relativeTo:)) ou un Font.<textStyle> : le texte doit suivre Dynamic Type."
    regex: '\.system\(\s*size:\s*[0-9]+(\.[0-9]+)?\s*[,)](?![^)]*relativeTo)'
    severity: error

  no_corner_radius:
    name: "cornerRadius déprécié"
    message: "Utilise .clipShape(.rect(cornerRadius:style: .continuous))."
    regex: '\.cornerRadius\('
    severity: error
