included:
  - App
  - Catalog
  - Packages
  - Tests

excluded:
  - .build
  - DerivedData
  - Packages/*/.build
  - "**/.build"

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

line_length:
  warning: 120
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

identifier_name:
  min_length: 2
  # s / m / l sont les noms des crans de l'echelle d'affiche de la planche 8
  # (poster.xs a poster.xxl). Les renommer ferait diverger le code du handoff.
  excluded: [id, ok, x, y, z, s, m, l]

nesting:
  type_level: 2

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

custom_rules:
  no_literal_color:
    name: "Couleur littérale"
    message: "Les couleurs se déclarent dans Packages/DesignSystem, jamais ailleurs."
    regex: '(Color\(\s*(red|hex)\s*:|UIColor\(|NSColor\(|#[0-9A-Fa-f]{6}\b)'
    excluded: ".*/Packages/DesignSystem/.*"
    severity: error

  no_fixed_font_size:
    name: "Taille de police fixe"
    message: "Utilise .font(.system(size:relativeTo:)) ou un Font.<textStyle> : le texte doit suivre Dynamic Type."
    regex: '\.system\(\s*size:\s*[0-9]+(\.[0-9]+)?\s*[,)](?![^)]*relativeTo)'
    severity: error

  no_corner_radius:
    name: "cornerRadius déprécié"
    message: "Utilise .clipShape(.rect(cornerRadius:style: .continuous))."
    regex: '\.cornerRadius\('
    # Sans ca, la regle mord sur tout commentaire qui la cite — y compris la
    # docstring de `dsClip`, qui explique justement pourquoi ne pas l'utiliser.
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  # Depuis L1, `refreshDerived()` compose `filterKeys` à partir des relations :
  # bibliothèque, collection, genres et personnes créditées y sont dénormalisés pour
  # être interrogeables en SQL. Une relation écrite sans rafraîchissement laisse donc
  # `filterKeys` en arrière, et l'entité devient introuvable par le filtre
  # correspondant — sans erreur, sans avertissement, et sans qu'aucun test de critère
  # ne bronche, puisque la relation est bien posée.
  #
  # Les seules portes autorisées sont les mutateurs de `TitleRepository` et de
  # `PersonRepository` (section « Relations »), qui appellent `refreshDerived()`.
  #
  # Exclusions, toutes assumées :
  #   - `Packages/CineShelfCore` : c'est là que vivent les mutateurs eux-mêmes ;
  #   - `Tests/` et `Packages/*/Tests` : les fixtures posent les relations à la main
  #     **exprès**, et rappellent `refreshDerived()` explicitement — c'est ce qui
  #     permet à `FilterKeyTests` de vérifier l'invariant, y compris à l'envers ;
  #   - `App/DemoData` : décision actée, une fixture n'est pas une action
  #     utilisateur et ne doit pas produire trois cents entrées de fil d'activité.
  #     `DemoCatalogTests` vérifie que ses `filterKeys` sont à jour.
  no_relation_write_outside_core:
    name: "Écriture de relation hors CineShelfCore"
    message: >-
      Une relation dénormalisée dans filterKeys ne s'écrit pas directement : passe par
      TitleRepository/PersonRepository (section Relations), qui appellent
      refreshDerived(). Sinon le filtre correspondant devient faux en silence.
    regex: '(?<!self)\.(genres|credits|collection|library)\s*=(?!=)'
    excluded:
      - ".*/Packages/CineShelfCore/.*"
      - ".*/Tests/.*"
      - ".*/App/DemoData/.*"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  # `#Predicate` plafonne à **cinq clauses** sur un `@Model` SwiftData — mesuré, voir
  # `predicateClause(active:_:)` et `docs/02` §5. Ce plafond ne se devine pas : au-delà,
  # la compilation part en trente secondes puis échoue, et à cinq elle coûte déjà 1,3 s
  # sans rien dire.
  #
  # Tous les prédicats vivent donc dans `Packages/CineShelfCore`, à côté de cette
  # documentation et des outils qui permettent de dépasser le plafond. La règle est
  # posée au niveau du **module** et non du seul fichier qui porte `predicateClause` :
  # les repositories ont de bonnes raisons d'interroger le magasin, et les y interdire
  # aurait forcé un détour sans bénéfice. Ce qu'on veut empêcher, c'est un prédicat
  # écrit dans une vue — où personne ne lira l'avertissement, et où aucune cible de
  # test ne peut le couvrir.
  no_predicate_outside_core:
    name: "#Predicate hors CineShelfCore"
    message: >-
      Les prédicats vivent dans CineShelfCore/Queries : #Predicate plafonne à cinq
      clauses sur un @Model, et une vue n'est couverte par aucun test. Ajoute une
      fabrique à EntityQueries, ou une clause à un filtre existant via predicateClause.
    regex: '#Predicate'
    excluded:
      - ".*/Packages/CineShelfCore/.*"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  # L'ancienne direction artistique vit dans
  # `Packages/DesignSystem/Sources/DesignSystem/Legacy/`, en sursis jusqu'a `V12`.
  # Elle n'est pas la pour etre reutilisee : elle est la pour que l'interface des
  # prompts 10 et 11 continue de s'afficher pendant qu'on exerce la logique.
  #
  # Cette regle empeche un fichier neuf de rattraper un concept que la direction
  # courante a **supprime**, pas renomme :
  #   - les ombres (`shadow: none` est une regle du systeme) ;
  #   - les bordures (« aucune affiche n'a de bordure, d'ombre, ni de coin
  #     arrondi ») ;
  #   - les jetons de couleur retires : `border/*`, `accent/soft`, `accent/solid`,
  #     `accent/text`, `status/info`, `status/warning`, `media/*`, `state/*`,
  #     `bg/selected` ;
  #   - `CardMetrics`, remplace par les six crans de `PosterScale`.
  #
  # Exclusions, toutes datees et toutes destinees a disparaitre avec `Legacy/` :
  #   - `Legacy/` lui-meme, qui declare ces symboles ;
  #   - `Components/`, les sept composants du banc d'essai, reecrits aux taches `V` ;
  #   - les huit fichiers de `App/` qui composaient les ecrans des prompts 10 et 11.
  #     La liste est **figee** : un fichier neuf ne s'y ajoute pas, il utilise le
  #     nouveau systeme.
  no_legacy_design_system:
    name: "Ancienne direction artistique"
    message: >-
      Ce symbole appartient a la direction abandonnee (Legacy/, en sursis jusqu'a V12).
      La direction courante n'a ni ombre ni bordure : utilise ColorTokens, Space, Radius,
      Stroke, Layer, Density et PosterScale. Voir DesignSystem/Legacy/README.md.
    regex: 'dsBorder|dsShadow|dsElevation|ShadowSpec|Elevation\.|CardMetrics|\.(borderSubtle|borderDefault|borderStrong|accentSoft|accentSolid|accentText|bgSelected|bgSurfaceRaised|statusWarning|statusInfo|mediaRing|mediaPlaceholder|stateArchived|statePrivate|textOnAccent)\b'
    excluded:
      - ".*/Packages/DesignSystem/Sources/DesignSystem/Legacy/.*"
      - ".*/Packages/DesignSystem/Sources/DesignSystem/Components/.*"
      # Les planches de composants du catalogue montrent ces sept composants : meme
      # statut qu'eux, elles partent avec eux.
      - ".*/Catalog/ComponentSheets.swift"
      - ".*/App/Features/Settings/SettingsView.swift"
      - ".*/App/Features/Titles/TitleDetailView.swift"
      - ".*/App/Features/Titles/TitlesGrid.swift"
      - ".*/App/Features/Titles/TitlesView.swift"
      - ".*/App/Navigation/CompactRootView.swift"
      - ".*/App/Navigation/ProfileMenu.swift"
      - ".*/App/Navigation/ProfilePicker.swift"
      - ".*/App/Navigation/ProfileSession.swift"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  # `sortName`, `searchText` et `nameKey` sont des champs **persistés et synchronises par
  # CloudKit**. Les replier avec `locale: .current` fait ecrire des valeurs differentes
  # selon la locale de l'appareil, et rien ne le signale.
  #
  # Mesure du 2026-08-04, `folding(options: [.diacriticInsensitive, .caseInsensitive])` :
  #
  #     mot            | fr_FR        | tr_TR
  #     Interstellar   | interstellar | ınterstellar
  #     ITALIA         | italia       | ıtalıa
  #     Independant    | independant  | ındependant
  #
  # Ce n'est pas un cas exotique : le turc et l'azeri ont un `i` sans point, donc **tout**
  # mot contenant un `I` majuscule diverge. `Genre.nameKey` sert au dedoublonnage — notre
  # remplacement de `@Attribute(.unique)` que CloudKit interdit — donc deux appareils qui
  # ne s'accordent pas sur la cle creent un doublon en silence.
  #
  # **Pourquoi une regle de lint et pas seulement des tests.** Verifie : un modele qui
  # contourne `TextFolding` passe les cinq tests d'invariance **sur une machine
  # francaise**, puisque `fr_FR` et `en_US_POSIX` replient pareil. La regression n'est
  # detectable que par une machine turque ou par cette regle.
  no_folding_outside_text_folding:
    name: "Repliage de texte hors TextFolding"
    message: >-
      Le repliage se fait par `.foldedForMatching` (TextFolding.swift), jamais en direct :
      sortName, searchText et nameKey sont synchronises par CloudKit, et `locale: .current`
      leur fait prendre des valeurs differentes selon l'appareil.
    regex: '\.folding\('
    excluded:
      - ".*/Packages/CineShelfCore/Sources/CineShelfCore/Models/TextFolding.swift"
      # Les tests comparent volontairement a d'autres locales : c'est leur controle negatif.
      - ".*/Tests/.*"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error
